; esp-oralb firmware for the ESP32-2432S024C ("Cheap Yellow Display", capacitive touch)
[platformio]
default_envs = cyd

[env:cyd]
; pioarduino platform 55.03.312 = Arduino-ESP32 3.3.12 on ESP-IDF 5.5.5 (TLSF heap allocator: no long-term
; fragmentation like IDF 4.4). Pinned release asset, published 2026-09-20.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv  ; local copy of the core table (custom_sdkconfig builds need it in the project): two 1.9 MB app slots for OTA
board_build.flash_mode = dio
board_build.f_flash = 40000000L
monitor_speed = 115200
upload_speed = 460800
lib_ldf_mode = chain
; Wire is only pulled in by LovyanGFX (touch I2C, unused: touch.cpp is bit-banged); linking it drags the IDF I2C driver
; into IRAM, which overflows the classic-ESP32 IRAM segment on Arduino-ESP32 3.x with Wi-Fi + BLE.
lib_ignore = Wire
; mbedTLS RAM for the alert TLS fetch: core 3.x leaves ~18 KB less heap than 2.0.17, and two fixed 16 KB record buffers
; plus the RSA-4096 chain check no longer fit ("X509 verification failed" = allocation failure). Receive stays 16 KB
; (servers may send full records); send is 4 KB; dynamic buffers are only allocated while needed.
; Changing this triggers a rebuild of the framework libraries (slow first build).
custom_sdkconfig =
    CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
    CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
    CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
    CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
; Heap headroom for the web UI next to TLS: 6 instead of 8 pre-allocated Wi-Fi RX buffers, no A-MPDU on transmit,
; one BLE connection, and a short TCP TIME_WAIT (every web request otherwise parks a closed socket for 2 min).
; Don't cut the receive side further: 4 RX buffers without A-MPDU receive made OTA crawl and then fail at 53%.
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=6
    '# CONFIG_ESP_WIFI_AMPDU_TX_ENABLED is not set'
    CONFIG_BTDM_CTRL_BLE_MAX_CONN=1
    CONFIG_LWIP_TCP_MSL=5000
lib_deps =
    lovyan03/LovyanGFX@1.2.28
    h2zero/NimBLE-Arduino@2.5.1
    tzapu/WiFiManager@2.0.17
build_flags =
    -std=gnu++17
    -Os
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -Wall
    -Iinclude
build_unflags = -std=gnu++11

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Iinclude
    -g
    -Iinclude
    '-DTEST_DATA_DIR="test/data"'

; Over-the-air upload (build + upload only after a first USB flash of a firmware with WIFI_ALWAYS_ON=1).
; The password is read from the environment, never stored here:
;   ESP_ORALB_OTA_PASSWORD=... pio run -e cyd_ota -t upload
[env:cyd_ota]
extends = env:cyd
upload_protocol = espota
upload_port = esp-oralb.local
upload_flags =
    --auth=${sysenv.ESP_ORALB_OTA_PASSWORD}
