<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>esp-oralb</title>
<style>
:root{color-scheme:dark;--bg:#0d0f12;--card:#171b21;--fg:#e6e9ee;--dim:#8b95a3;--acc:#3fb6d9;--bad:#e5534b;--ok:#4cc38a;--line:#272d36}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:20px;margin:8px 0}h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px}.kv span:nth-child(odd){color:var(--dim)}.kv span:nth-child(even){text-align:right;word-break:break-all}
label{display:block;margin:8px 0 2px;color:var(--dim);font-size:13px}
input[type=text],input[type=number],input[type=datetime-local]{width:100%;padding:8px;background:#0d1015;border:1px solid var(--line);border-radius:6px;color:var(--fg);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.chk{display:flex;align-items:center;gap:8px;color:var(--fg);margin:6px 0}
button{padding:9px 14px;border:0;border-radius:6px;background:var(--acc);color:#05202a;font:inherit;font-weight:600;cursor:pointer}
button.alt{background:#2a313b;color:var(--fg)}button.bad{background:var(--bad);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#msg{position:fixed;left:0;right:0;bottom:0;padding:10px 16px;background:var(--ok);color:#04210f;display:none;text-align:center}
#msg.err{background:var(--bad);color:#fff}
small{color:var(--dim)}
</style></head><body><main>
<h1>esp-oralb</h1>
<section><h2>Status</h2><div class="kv" id="st"></div></section>
<section><h2>Time</h2>
<div class="kv" id="tm"></div>
<div class="bar"><button id="tnow">Use this device's time</button></div>
<label for="tloc">Or set manually (in the device's time zone)</label>
<div class="row"><input type="datetime-local" id="tloc" step="60"><button class="alt" id="tset">Set</button></div>
</section>
<section><h2>Settings</h2><form id="f"></form>
<div class="bar"><button id="save">Save</button><button class="alt" id="reload">Reload</button></div>
<small>Changes apply immediately. A new location or region refetches at once.</small></section>
<section><h2>Device</h2><div class="bar">
<button class="alt" id="portal">Wi-Fi setup portal</button><button class="bad" id="reboot">Reboot</button></div></section>
</main><div id="msg"></div>
<script>
const $=id=>document.getElementById(id);
const F=[['lat','Latitude','number','step="0.0001" min="-90" max="90"'],['lon','Longitude','number','step="0.0001" min="-180" max="180"'],
['loc','Location name (display only)','text','maxlength="23"'],['region','Alert region id (31 = Kyiv city, 14 = Kyiv oblast)','text','maxlength="7"'],
['tz','Time zone (POSIX TZ)','text','maxlength="47"'],
['night_start','Night starts (hour)','number','min="0" max="23"'],['night_end','Night ends (hour)','number','min="0" max="23"'],
['night_wake','Night wake after touch (s)','number','min="1" max="600"'],
['ldr_bright','Light sensor: bright reading','number','min="0" max="4095"'],['ldr_dark','Light sensor: dark reading','number','min="0" max="4095"'],
['bl_min','Backlight min','number','min="0" max="255"'],['bl_max','Backlight max','number','min="0" max="255"'],
['led_max','LED max brightness','number','min="0" max="255"'],
['show_weather','Show weather','chk'],['show_alert','Show air-raid alert','chk'],['show_zones','Show zone map','chk']];
let h='';
for(const [k,l,t,a] of F)h+=t=='chk'?`<label class="chk"><input type="checkbox" name="${k}">${l}</label>`:`<label for="s_${k}">${l}</label><input id="s_${k}" name="${k}" type="${t}" ${a}${t=='number'?' inputmode="decimal"':''}>`;
$('f').innerHTML=h;
function msg(t,e){const m=$('msg');m.textContent=t;m.className=e?'err':'';m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',3500)}
async function api(p,body){
 const o={headers:{'X-Requested-With':'esp-oralb'}};
 if(body){o.method='POST';o.headers['Content-Type']='application/x-www-form-urlencoded';o.body=new URLSearchParams(body).toString()}
 const r=await fetch(p,o);let j={};try{j=await r.json()}catch(e){}
 if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
function kv(el,rows){el.replaceChildren();for(const [k,v] of rows){for(const t of [k,v]){const s=document.createElement('span');s.textContent=t;el.append(s)}}}
const dur=s=>{s=Math.max(0,s|0);return (s>=86400?Math.floor(s/86400)+'d ':'')+Math.floor(s%86400/3600)+'h '+Math.floor(s%3600/60)+'m '+s%60+'s'};
const ago=s=>s<0?'never':dur(s)+' ago';
async function status(){
 try{const s=await api('/api/status');
 kv($('st'),[['Firmware',s.fw],['SDK',s.sdk],['Uptime',dur(s.uptime_s)],['Heap free / largest',s.heap.free+' / '+s.heap.largest],
 ['Wi-Fi',s.wifi.ssid+' ('+s.wifi.rssi+' dBm)'],['IP',s.wifi.ip],['Screen',s.screen],
 ['Light sensor raw / level / backlight',s.light.raw+' / '+s.light.level+' / '+s.light.backlight],
 ['Brush last seen',ago(s.brush.seen_s)],
 ['Last session',s.brush.last?dur(s.brush.last.secs)+', '+s.brush.last.hits+' pressure hits, ended '+s.brush.last.ended:'none'],
 ['Weather',s.weather.have?s.weather.temp+' C, code '+s.weather.code+', '+ago(s.weather.age_s):'no data ('+(s.weather.ok?'ok':'last fetch failed')+')'],
 ['Alert',!s.alert.enabled?'off':(s.alert.have?s.alert.level+(s.alert.since?' since '+s.alert.since:'')+', '+ago(s.alert.age_s):'no data (code '+s.alert.code+')')]]);
 kv($('tm'),[['Device time',s.time.local],['Source',s.time.source],['Zone',s.time.tz]]);
 }catch(e){msg(e.message,1)}}
async function load(){try{const s=await api('/api/settings');const f=$('f');
 for(const [k,,t] of F){const e=f.elements[k];if(t=='chk')e.checked=!!s[k];else e.value=s[k]}}catch(e){msg(e.message,1)}}
$('save').onclick=async e=>{e.preventDefault();const f=$('f'),b={};
 for(const [k,,t] of F){const x=f.elements[k];b[k]=t=='chk'?(x.checked?1:0):x.value}
 try{await api('/api/settings',b);msg('Saved');load();status()}catch(x){msg(x.message,1)}};
$('reload').onclick=load;
$('tnow').onclick=async()=>{try{await api('/api/time',{epoch:Math.floor(Date.now()/1000)});msg('Time set');status()}catch(x){msg(x.message,1)}};
$('tset').onclick=async()=>{const v=$('tloc').value;if(!v)return msg('Pick a date and time',1);
 try{await api('/api/time',{local:v});msg('Time set');status()}catch(x){msg(x.message,1)}};
$('reboot').onclick=async()=>{if(!confirm('Reboot the device?'))return;try{await api('/api/reboot',{});msg('Rebooting...')}catch(x){msg(x.message,1)}};
$('portal').onclick=async()=>{if(!confirm('Open the Wi-Fi setup portal? This page goes offline until it closes.'))return;try{await api('/api/portal',{});msg('Portal opening...')}catch(x){msg(x.message,1)}};
load();status();setInterval(()=>{if(!document.hidden)status()},5000);
</script></body></html>
