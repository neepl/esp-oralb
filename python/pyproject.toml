[project]
name = "esp-oralb"
version = "0.1.0"
description = "Live brushing display for Oral-B iO toothbrushes (BLE advertisement listener)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "rich>=13",
]

[project.scripts]
esp-oralb = "esp_oralb.app:main"
esp-oralb-zones = "esp_oralb.zones:main"

[dependency-groups]
dev = ["pytest>=8", "numpy>=1.26"]  # numpy: fitting the LDA zone model

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
