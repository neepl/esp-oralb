; esp-oralb firmware for the ESP32-2432S024C ("Cheap Yellow Display", capacitive touch)
[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.11.0          ; Arduino-ESP32 2.0.17
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv  ; two 1.9 MB app slots: required for OTA (huge_app has one slot, OTA aborts)
board_build.flash_mode = dio
board_build.f_flash = 40000000L
monitor_speed = 115200
upload_speed = 460800
lib_ldf_mode = chain
lib_deps =
    lovyan03/LovyanGFX@1.2.7
    h2zero/NimBLE-Arduino@1.4.3
    tzapu/WiFiManager@2.0.17
build_flags =
    -std=gnu++17
    -Os
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
    -Wall
    -Iinclude
build_unflags = -std=gnu++11

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Iinclude
    -g
    -Iinclude
    '-DTEST_DATA_DIR="test/data"'

; Over-the-air upload (build + upload only after a first USB flash of a firmware with WIFI_ALWAYS_ON=1).
; The password is read from the environment, never stored here:
;   ESP_ORALB_OTA_PASSWORD=... pio run -e cyd_ota -t upload
[env:cyd_ota]
extends = env:cyd
upload_protocol = espota
upload_port = esp-oralb.local
upload_flags =
    --auth=${sysenv.ESP_ORALB_OTA_PASSWORD}
